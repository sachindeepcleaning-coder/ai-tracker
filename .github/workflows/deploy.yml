name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [master]
    # `frontend/**` covers data.json + all UI; root CSVs/docs also affect the built site via data.json regeneration.
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy.yml'
      - 'coding_benchmarks*.csv'
      - '*.md'
      - '*.json'
  workflow_dispatch:

# Allow only one concurrent deployment; cancel superseded runs.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # actions/deploy-pages requires this exact environment name
    # (it is what Pages' "Source: GitHub Actions" mode deploys to).
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Migrates Pages from "deploy from branch" (gh-pages) to
      # "GitHub Actions" source mode; both build from identical master content.
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Regenerate data (gated — fails on rank/validation errors)
        run: npm run data

      - name: Lint
        run: npm run lint

      - name: Tests (would have caught #1, #2, #5–#7 before Pages went blank)
        run: npm run test

      - name: Build (base=/ai-tracker/)
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
