name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [master]
    # `frontend/**` covers data.json + all UI; root CSVs/docs also affect the built site via data.json regeneration.
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy.yml'
      - 'coding_benchmarks*.csv'
      - '*.md'
      - '*.json'
  workflow_dispatch:

# Allow only one concurrent deployment; cancel superseded runs.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # actions/deploy-pages requires this exact environment name
    # (it is what Pages' "Source: GitHub Actions" mode deploys to).
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        # Pinned to the v7 tag SHA (checked 2026-10-08); bump deliberately.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history: gitleaks fingerprint ignores reference the original
          # commit; a shallow checkout changes fingerprints and breaks the scan.
          fetch-depth: 0

      - name: Secret scan (gitleaks, blocking)
        run: |
          cd "${GITHUB_WORKSPACE}"
          curl -sL "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz" -o /tmp/gitleaks.tgz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tgz" | sha256sum -c -
          tar xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --no-banner --redact

      # Migrates Pages from "deploy from branch" (gh-pages) to
      # "GitHub Actions" source mode; both build from identical master content.
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
        with:
          enablement: true

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Regenerate data (gated — fails on rank/validation errors)
        run: npm run data

      - name: Drift gate (regen outputs must match committed files)
        run: git diff --exit-code ../README.md src/data.json public/data.json public/sw-version.js public/sitemap.xml src/lib/fx.generated.ts
        working-directory: frontend

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests (would have caught #1, #2, #5–#7 before Pages went blank)
        run: npm run test

      - name: Build (base=/ai-tracker/)
        run: npm run build

      # Measure-first loop: gzip budgets block bundle regressions; preview
      # timing + baseline drift are report-only (machine variance is not a gate).
      - name: Perf budgets (blocking on sizes)
        run: npm run perf

      # Blocking on critical/serious only: moderate/minor stay advisory so a
      # new low-impact rule cannot hold up a data deploy. Counts come from the
      # axe JSON (not the CLI exit code, which fails on any violation).
      - name: Accessibility (axe on the built page; critical/serious block)
        run: |
          npm run preview -- --port 8935 --strictPort &
          SRV=$!
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8935/ai-tracker/ >/dev/null; then break; fi
            sleep 2
          done
          set +e
          npx --yes @axe-core/cli http://localhost:8935/ai-tracker/ --exit --save axe-results.json > axe-report.txt 2>&1
          AXE_EXIT=$?
          set -e
          kill $SRV 2>/dev/null || true
          BLOCK=0
          {
            echo "## Accessibility (axe, blocking on critical/serious)"
            python3 - <<'EOF'
          import json
          try:
              d = json.load(open('axe-results.json'))
              pages = d if isinstance(d, list) else [d]
              by_impact = {}
              for page in pages:
                  for v in page.get('violations', []):
                      by_impact[v['impact']] = by_impact.get(v['impact'], 0) + len(v.get('nodes', []))
              if not by_impact:
                  print('0 violations found.')
              else:
                  for impact in ('critical', 'serious', 'moderate', 'minor'):
                      if impact in by_impact:
                          print(f'- {impact}: {by_impact[impact]} failing nodes')
              blocking = by_impact.get('critical', 0) + by_impact.get('serious', 0)
              if blocking:
                  print(f'BLOCKING: {blocking} critical/serious nodes')
                  open('/tmp/axe-block', 'w').write('1')
          except Exception as e:
              print(f'axe results unparseable: {e}')
          EOF
            echo "axe exit code: $AXE_EXIT (advisory; the gate is critical/serious counts)"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          rm -f axe-results.json axe-report.txt
          if [ -f /tmp/axe-block ]; then echo 'axe: critical/serious violations — failing the build'; exit 1; fi
          exit 0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: frontend/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
