name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [master]
    # `frontend/**` covers data.json + all UI; root CSVs/docs also affect the built site via data.json regeneration.
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy.yml'
      - 'coding_benchmarks*.csv'
      - '*.md'
      - '*.json'
  workflow_dispatch:

# Allow only one concurrent deployment; cancel superseded runs.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # actions/deploy-pages requires this exact environment name
    # (it is what Pages' "Source: GitHub Actions" mode deploys to).
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Migrates Pages from "deploy from branch" (gh-pages) to
      # "GitHub Actions" source mode; both build from identical master content.
      - name: Configure Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Regenerate data (gated — fails on rank/validation errors)
        run: npm run data

      - name: Regenerate README stats block (CSV-derived, committed content wins on conflicts)
        run: node ../scripts/readme-stats.mjs
        working-directory: frontend

      - name: Drift gate (regen outputs must match committed files)
        run: git diff --exit-code ../README.md src/data.json ../public/data.json
        working-directory: frontend

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests (would have caught #1, #2, #5–#7 before Pages went blank)
        run: npm run test

      - name: Build (base=/ai-tracker/)
        run: npm run build

      - name: Accessibility report, non-blocking (axe on the built page)
        run: |
          npm run preview -- --port 8935 --strictPort &
          SRV=$!
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8935/ai-tracker/ >/dev/null; then break; fi
            sleep 2
          done
          set +e
          npx --yes @axe-core/cli http://localhost:8935/ai-tracker/ --exit --save axe-results.json > axe-report.txt 2>&1
          AXE_EXIT=$?
          set -e
          kill $SRV 2>/dev/null || true
          {
            echo "## Accessibility (axe, non-blocking, built page)"
            python3 - <<'EOF'
          import json
          try:
              d = json.load(open('axe-results.json'))
              pages = d if isinstance(d, list) else [d]
              by_impact = {}
              for page in pages:
                  for v in page.get('violations', []):
                      by_impact[v['impact']] = by_impact.get(v['impact'], 0) + len(v.get('nodes', []))
              if not by_impact:
                  print('0 violations found.')
              else:
                  for impact in ('critical', 'serious', 'moderate', 'minor'):
                      if impact in by_impact:
                          print(f'- {impact}: {by_impact[impact]} failing nodes')
          except Exception as e:
              print(f'axe results unparseable: {e}')
          EOF
            echo "axe exit code: $AXE_EXIT (step is non-blocking)"
          } >> "$GITHUB_STEP_SUMMARY"
          rm -f axe-results.json axe-report.txt
          exit 0
        continue-on-error: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
